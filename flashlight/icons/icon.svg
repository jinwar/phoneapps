<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c2c2e"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <radialGradient id="beam" cx="50%" cy="100%" r="85%">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.95"/>
      <stop offset="0.6" stop-color="#ffd60a" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffd60a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lens" cx="50%" cy="42%" r="65%">
      <stop offset="0" stop-color="#fff6d6"/>
      <stop offset="0.55" stop-color="#ffd60a"/>
      <stop offset="1" stop-color="#e0a800"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6e6e73"/>
      <stop offset="0.45" stop-color="#48484a"/>
      <stop offset="1" stop-color="#2c2c2e"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f2f2f5"/>
      <stop offset="0.5" stop-color="#d4d4d8"/>
      <stop offset="1" stop-color="#a8a8ad"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <polygon points="196,178 316,178 400,54 112,54" fill="url(#beam)"/>

  <g filter="url(#glow)">
    <ellipse cx="256" cy="176" rx="72" ry="26" fill="#ffd60a" opacity="0.55"/>
  </g>

  <rect x="176" y="140" width="160" height="92" rx="20" fill="url(#head)"/>
  <rect x="176" y="140" width="160" height="92" rx="20" fill="none" stroke="#8b8b90" stroke-width="3"/>
  <circle cx="256" cy="186" r="40" fill="url(#lens)"/>
  <circle cx="256" cy="186" r="40" fill="none" stroke="#c99400" stroke-width="3"/>

  <rect x="198" y="224" width="116" height="204" rx="26" fill="url(#body)"/>
  <rect x="198" y="224" width="116" height="204" rx="26" fill="none" stroke="#1c1c1e" stroke-width="3"/>

  <rect x="210" y="270" width="92" height="10" rx="5" fill="#1c1c1e" opacity="0.55"/>
  <rect x="210" y="300" width="92" height="10" rx="5" fill="#1c1c1e" opacity="0.55"/>
  <rect x="210" y="330" width="92" height="10" rx="5" fill="#1c1c1e" opacity="0.55"/>

  <circle cx="256" cy="392" r="17" fill="#ffd60a"/>
  <circle cx="256" cy="392" r="17" fill="none" stroke="#c99400" stroke-width="3"/>

  <rect x="208" y="228" width="14" height="196" rx="7" fill="#ffffff" opacity="0.12"/>
</svg>
